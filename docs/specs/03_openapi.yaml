openapi: 3.1.0
info:
  title: Urban AR Team Adventure Game API
  version: 1.0.0
  description: Baseline machine-readable contract generated from API Contract v1. Business rules are governed by Product Blueprint
    v1.
servers:
- url: https://api.example.com/api/v1
  description: Production placeholder
- url: http://localhost:8000/api/v1
  description: Local development
tags:
- name: AR
- name: AntiCheat
- name: Audit
- name: Auth
- name: Billing
- name: Checkpoints
- name: Devices
- name: GameMaster
- name: GameSessions
- name: Games
- name: Hints
- name: LiveChallenges
- name: Locations
- name: Media
- name: Organizations
- name: QR
- name: Runtime
- name: ScenarioAssignments
- name: ScenarioGraph
- name: Scenarios
- name: Scores
- name: Store
- name: Teams
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      security: []
      description: Atomic user, device and token creation. Five requests per minute per IP. Retry duplicates return 422; tokens are never replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRegistration'
      responses:
        '201':
          description: Created; token is returned only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthenticationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      security: []
      description: Ten requests per minute per IP. Both identifiers, when supplied, must match the same account. Suspended, blocked and revoked devices are denied with AUTHORIZATION_DENIED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLogin'
      responses:
        '200':
          description: New token; existing device metadata refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthenticationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Current token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdentityDeviceHeader'
      responses:
        '200':
          description: Public self profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IdentityUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Auth]
      operationId: updateMe
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one login identifier must remain after applying changes. All other fields, including status, role and user_id, are rejected.
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: [string, 'null']
                  format: email
                  maxLength: 255
                mobile:
                  type: [string, 'null']
                  pattern: '^\+?[0-9]{7,15}$'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdentityUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      - name: cursor
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Owned devices, including revocation history; cursor pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdentityDevice'
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          cursor: {type: [string, 'null']}
                          next_cursor: {type: [string, 'null']}
                          has_more: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices/{device_id}:
    delete:
      tags: [Devices]
      operationId: revokeDevice
      security:
      - bearerAuth: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204':
          description: Revoked or already revoked. All tokens issued for this device are revoked. Repeating with a revoked token returns 401; another active device may safely repeat.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams:
    post:
      tags:
        - Teams
      operationId: createTeam
      security:
        -
          bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
          description: 'Optional, actor-scoped, 24-hour replay. Same key with a different operation or payload returns IDEMPOTENCY_CONFLICT. Current identity and resource access are rechecked.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      description: 'Creates a personal persistent Team with its creator as captain and first active member. Organization ownership cannot be supplied by the client.'
    get:
      tags:
        - Teams
      operationId: listTeams
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        -
          name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      description: 'Member-safe Team projection; archived history accessible to former members. Unrelated resources are hidden except explicitly privileged support scope. Never includes private identity data or membership history of others.'
  '/teams/{team_id}':
    get:
      tags:
        - Teams
      operationId: getTeam
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: 'Member-safe Team projection; archived history accessible to former members. Unrelated resources are hidden except explicitly privileged support scope. Never includes private identity data or membership history of others.'
    patch:
      tags:
        - Teams
      operationId: updateTeam
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
          description: 'Optional, actor-scoped, 24-hour replay. Same key with a different operation or payload returns IDEMPOTENCY_CONFLICT. Current identity and resource access are rechecked.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
  '/teams/{team_id}/invites':
    post:
      tags:
        - Teams
      operationId: createTeamInvite
      security:
        -
          bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInviteCreate'
      description: 'Captain or authorized audited support override. Raw invite_code returned only at creation; only its hash is persisted. Idempotency-Key is not accepted for this operation.'
    get:
      tags:
        - Teams
      operationId: listTeamInvites
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInviteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        -
          name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        -
          name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
