      parameters:
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
          description: 'Optional, actor-scoped, 24-hour replay. Same key with a different operation or payload returns IDEMPOTENCY_CONFLICT. Current identity and resource access are rechecked.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamJoin'
      description: 'Consumes an opaque invite atomically under Team/invite locks. Errors: TEAM_FULL, INVITE_EXPIRED, INVITE_REVOKED, ALREADY_TEAM_MEMBER, ACTION_NOT_ALLOWED (exhausted), STATE_TRANSITION_INVALID (archived), RESOURCE_NOT_FOUND. Organization-associated Teams also require current tenant access.'
