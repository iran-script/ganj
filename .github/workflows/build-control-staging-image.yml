name: Build NEXO Control Center staging image

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source commit to build
        required: true
        type: string
        default: 2111243fff34f724d98c7ae6a825785967fbe882

permissions:
  contents: read

jobs:
  build-control-image:
    name: Build linux/amd64 Control Center image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify requested source and Docker target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          expected='2111243fff34f724d98c7ae6a825785967fbe882'
          [[ "$TARGET_SHA" == "$expected" ]] || { echo 'Only the approved target SHA may be built.' >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "Checked out $actual instead of $expected." >&2; exit 1; }
          grep -Eq '^FROM .* AS production-control[[:space:]]*$' Dockerfile || { echo 'Dockerfile production-control target was not found.' >&2; exit 1; }
          grep -Eq '^ENV NEXT_PUBLIC_API_BASE_URL=/api/v1[[:space:]]*$' Dockerfile || { echo 'Expected relative Control Center API base is missing.' >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production-control image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production-control
          platforms: linux/amd64
          tags: nexo-control-staging:2111243fff34f724d98c7ae6a825785967fbe882
          outputs: type=docker,dest=${{ runner.temp }}/nexo-control-staging.tar
          provenance: false

      - name: Package image and checksum
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_TAG: nexo-control-staging:2111243fff34f724d98c7ae6a825785967fbe882
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/nexo-control-staging.tar"
          artifact_dir="${{ runner.temp }}/nexo-control-staging-artifact"
          mkdir -p "$artifact_dir"
          test -s "$archive"
          docker load --input "$archive"
          image_size_bytes="$(docker image inspect "$IMAGE_TAG" | jq -r '.[0].Size')"
          image_id="$(docker image inspect "$IMAGE_TAG" | jq -r '.[0].Id')"
          [[ "$image_size_bytes" =~ ^[0-9]+$ ]]
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          tar_bytes="$(stat -c '%s' "$archive")"
          gzip -1 -c "$archive" > "$artifact_dir/nexo-control-staging.tar.gz"
          compressed_bytes="$(stat -c '%s' "$artifact_dir/nexo-control-staging.tar.gz")"
          (
            cd "$artifact_dir"
            sha256sum nexo-control-staging.tar.gz > SHA256SUMS
          )
          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg platform 'linux/amd64' \
            --arg target 'production-control' \
            --arg image_id "$image_id" \
            --argjson image_size_bytes "$image_size_bytes" \
            --argjson image_tar_bytes "$tar_bytes" \
            --argjson compressed_archive_bytes "$compressed_bytes" \
            '{target_sha:$target_sha,workflow_sha:$workflow_sha,image_tag:$image_tag,image_id:$image_id,platform:$platform,target:$target,image_size_bytes:$image_size_bytes,image_tar_bytes:$image_tar_bytes,compressed_archive_bytes:$compressed_archive_bytes}' \
            > "$artifact_dir/build-metadata.json"
          cat "$artifact_dir/SHA256SUMS"
          cat "$artifact_dir/build-metadata.json"

      - name: Upload private repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexo-control-staging-2111243fff34f724d98c7ae6a825785967fbe882
          path: |
            ${{ runner.temp }}/nexo-control-staging-artifact/nexo-control-staging.tar.gz
            ${{ runner.temp }}/nexo-control-staging-artifact/SHA256SUMS
            ${{ runner.temp }}/nexo-control-staging-artifact/build-metadata.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
