name: nexo

x-service: &service
  restart: unless-stopped
  networks: [nexo]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

x-app: &app
  <<: *service
  image: nexo-app:production
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: nexo-postgres
    DB_PORT: "5432"
    DB_DATABASE: nexo
    DB_USERNAME: nexo
    REDIS_HOST: nexo-redis
    REDIS_PORT: "6379"
    QUEUE_CONNECTION: redis
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  mem_limit: 128m
  memswap_limit: 128m

services:
  app:
    <<: *app
    container_name: nexo-app
    build:
      context: .
      target: production
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    <<: *service
    container_name: nexo-nginx
    image: nexo-nginx:production
    build:
      context: .
      target: production-nginx
    ports:
      - "127.0.0.1:${NEXO_HTTP_PORT:-18100}:80"
    depends_on:
      app: { condition: service_healthy }
      control: { condition: service_healthy }
    mem_limit: 32m
    memswap_limit: 32m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/v1/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  control:
    <<: *service
    container_name: nexo-control
    image: nexo-control:production
    build:
      context: .
      target: production-control
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    <<: *service
    container_name: nexo-postgres
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server-only .env}
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=32MB]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nexo -d nexo]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    container_name: nexo-redis
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory, 32mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  queue:
    <<: *app
    container_name: nexo-queue
    command: [php, artisan, "queue:work", redis, --sleep=3, --tries=3, --backoff=5, --timeout=60, --memory=80, --max-time=3600, --no-interaction]
    stop_grace_period: 75s

  scheduler:
    <<: *app
    container_name: nexo-scheduler
    command: [php, artisan, "schedule:work", --no-interaction]
    stop_grace_period: 75s

networks:
  nexo:
    driver: bridge

volumes:
  app_storage:
  postgres_data:
  redis_data:
