name: nexo-user-management-test

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urban_ar_test
      POSTGRES_USER: nexo_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=20, -c, work_mem=2MB]
    volumes:
      - nexo_user_management_test_postgres:/var/lib/postgresql/data
    networks: [testnet]
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nexo_test -d urban_ar_test]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, no, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - nexo_user_management_test_redis:/data
    networks: [testnet]
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.user-management-test
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: ${TEST_APP_KEY:?TEST_APP_KEY must be set}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: urban_ar_test
      DB_USERNAME: nexo_test
      DB_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      PULSE_ENABLED: "false"
      TELESCOPE_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [testnet]
    mem_limit: 768m
    memswap_limit: 768m

networks:
  testnet:
    internal: true

volumes:
  nexo_user_management_test_postgres:
  nexo_user_management_test_redis:
