services:
  app:
    build: .
    env_file: .env
    volumes: [media_storage:/var/www/html/storage/app/private]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
  worker:
    restart: unless-stopped
    build: .
    env_file: .env
    volumes: [media_storage:/var/www/html/storage/app/private]
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }
    command: php artisan queue:work redis --sleep=1 --tries=3 --backoff=5
  scheduler:
    restart: unless-stopped
    build: .
    env_file: .env
    volumes: [media_storage:/var/www/html/storage/app/private]
    depends_on:
      app: { condition: service_started }
    command: php artisan schedule:work
  nginx:
    image: nginx:1.27-alpine
    ports: ["18000:80"]
    depends_on: [app]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urban_ar
      POSTGRES_USER: urban_ar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U urban_ar -d urban_ar"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  postgres_data:
  redis_data:
  media_storage:
